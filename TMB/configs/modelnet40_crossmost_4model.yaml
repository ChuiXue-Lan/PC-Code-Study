model : {
  NAME: Point_BERT,
  m: 0.999,
  T: 0.07,
  K: 16384,
  transformer_config: {
    mask_ratio: [0.3, 0.4],
    trans_dim: 384,
    depth: 12,
    drop_path_rate: 0.1,
    cls_dim: 512,
    replace_pob: 0.,
    num_heads: 6,
    moco_loss: False,
    dvae_loss: False,
    cutmix_loss: False,
    return_all_tokens: False,
  },
  dvae_config : {
    group_size: 32,
    num_group: 64,
    encoder_dims: 256,
    num_tokens: 8192,
    tokens_dims: 256, 
    decoder_dims: 256, 
    ckpt: './checkpoints/dVAE.pth'  # set the dVAE weight here
  }
}

grad_norm_clip : 10

input_size : 224
mask_patch_size: 32
model_patch_size: 16
model_ema_decay_init: 0.99
warm_it: 400

mask_ratio: 0.3

# Image modality weights
w_align_image: 0.2
w_fair_image: 1
w_mim_image: 1

# Point cloud modality weights
w_align_pc: 0.2
w_fair_pc: 1
w_mim_pc: 1

# Depth modality weights
w_align_depth: 0.2
w_fair_depth: 1
w_mim_depth: 1

# Confidence thresholds
conf_threshold_image: 0.8
conf_threshold_pc: 0.82
conf_threshold_depth: 0.8
pc_loss_weight: 1
depth_loss_weight: 1

# Cross-modal alignment
combined_pseudolabels: True
conf_threshold_combined: 0.84
conf_weight_pc: 0.45
conf_weight_depth: 0.45
pseudolabel_agreement_loss: False
w_pseudo_agree: 0.1

# Cross-modal alignment weights
image_pc_align: True
w_image_pc_align: 0.5
depth_image_align: True
w_depth_image_align: 0.5
pc_depth_align: True
w_pc_depth_align: 0.5

agreement_pseudolabels: False
agreement_pseudolabels_min_thresh: 0.2

lr: 0.00002
epochs: 200
warmup_epochs : 1
eval_freq: 1
npoints: 8192
batch_size : 128
consider_metric: CDL1

from_scratch: False
ulip: False

entropy_image: False
entropy_pc: False
entropy_depth: False

only_pc: False
only_image: False
only_depth: False
mask: True

pairwise_alignment: True
trans_pcl_img: True
trans_img_pcl: True
trans_depth_img: True
trans_img_depth: True
trans_pcl_depth: True
trans_depth_pcl: True

depth_modality_center: False
trans_depth_img: True       
trans_img_depth: True
trans_pcl_depth: True 
trans_depth_pcl: True

modality_center: False
